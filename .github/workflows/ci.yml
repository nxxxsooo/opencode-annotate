name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/native.yml
  check:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          path: tui/bin
          merge-multiple: true
      - run: find tui/bin -type f -exec chmod +x {} +
      - run: node scripts/verify-tui.mjs --all
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/verify-package.test.py
