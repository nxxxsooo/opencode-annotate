name: Native reviewer
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - run: npm run check:tui
      - run: npm run build:tui -- ${{ matrix.platform }}
      - run: node scripts/verify-tui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.platform }}
          path: tui/bin/
          if-no-files-found: error
