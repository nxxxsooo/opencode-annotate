<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCode Annotate</title><link rel="stylesheet" href="panel.css"></head>
<body>
  <header><h1>Annotate</h1><span id="count">0 notes</span></header>
  <main>
    <section aria-label="Target session">
      <div class="connection-row"><h2>Send to</h2><button id="change-target" type="button" aria-expanded="false" aria-controls="session-options">Change</button></div>
      <p id="paired">Looking for your OpenCode session…</p><p id="connection-hint" class="hint" aria-live="polite"></p>
      <div id="session-options" hidden><label for="targets">Choose session</label><select id="targets"><option value="">Select a session…</option></select><button id="refresh-targets" type="button">Refresh sessions</button></div>
    </section>
    <section aria-label="Page annotation"><h2 id="page-title">Open a page</h2><p id="page-url"></p>
      <button id="pick" aria-pressed="false">Pick an element</button><p id="pick-hint" class="hint">Or select text on the page, write feedback, then send. Use Save note to collect several notes first.</p>
      <blockquote id="quote">Select text or an element to begin.</blockquote>
      <label for="kind">Feedback type</label><select id="kind"><option value="comment">Comment</option><option value="ask">Question</option></select>
      <label for="comment">My feedback</label><textarea id="comment" rows="4" maxlength="8000" placeholder="What should change, or what would you like to understand?"></textarea>
      <div class="actions"><button id="save">Save note</button><button id="cancel">Cancel edit</button></div>
    </section>
    <section aria-label="Saved feedback"><h2>Notes</h2><ol id="notes"></ol></section>
    <details><summary>Context preview</summary><pre id="preview"></pre></details>
  </main>
  <footer><button id="send" class="primary" aria-describedby="paired">Send &amp; continue</button><div class="actions"><button id="copy">Copy Markdown</button><button id="export">Export JSON</button></div><p id="status" role="status" aria-live="polite">Ready</p></footer>
  <script type="module" src="panel.mjs"></script>
</body></html>
